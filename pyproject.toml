[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-semantic-search"
version = "1.1.4"
description = "A library for embedding, indexing, and applying semantic search for text and image data"
readme = "README.md"
authors = [
    {name = "Harduex", email = "simeon.simka@gmail.com"}
]
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "sentence-transformers>=2.7.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "faiss-cpu>=1.8.0",
    "pandas>=2.0.0",
    "numpy>=1.22.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.60.0",
    "beautifulsoup4>=4.9.0",
    "kmeans-pytorch>=0.3",
    "langchain>=0.1.0",
    "langchain-community>=0.0.1",
    "langchain-huggingface>=0.1.0",
    "langchain-ollama>=0.3.0",
    "langchain-text-splitters>=0.2.0",
    "chromadb>=0.4.0",
    "pillow>=10.0.0",
    "click>=8.0.0",
]

[project.scripts]
dss = "deep_semantic_search.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]

[project.urls]
"Homepage" = "https://github.com/Harduex/deep-semantic-search"
"Bug Tracker" = "https://github.com/Harduex/deep-semantic-search/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]